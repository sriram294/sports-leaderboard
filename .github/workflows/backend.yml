name: Backend checks

on:
  pull_request:
    paths: ['backend/**', 'docs/backend/**', '.github/workflows/backend.yml']
  push:
    branches: [master]
    paths: ['backend/**', 'docs/backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: playboard_test
          POSTGRES_USER: playboard
          POSTGRES_PASSWORD: playboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playboard -d playboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/playboard_test
      DB_USERNAME: playboard
      DB_PASSWORD: playboard
      GOOGLE_CLIENT_ID: test-google-client-id
      JWT_SECRET: test-only-jwt-secret-that-is-longer-than-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw test
