name: PWA checks

on:
  pull_request:
    paths: ['pwa/**', 'docs/pwa/**', '.github/workflows/pwa.yml']
  push:
    branches: [master]
    paths: ['pwa/**', 'docs/pwa/**', '.github/workflows/pwa.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
